name: Scrape weather

# Only DHM and METAR, every 30 minutes, kept apart from the price scrapers so
# a slow price site can't delay the weather. GitHub runs scheduled jobs late
# when it is busy, so real gaps are often longer than 30 minutes; the app
# only trusts a station reading for 75 minutes and falls back to the model.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Scrape DHM weather
        timeout-minutes: 3
        run: python scrapers/dhm.py || true

      - name: Scrape METAR (Nepal airports)
        timeout-minutes: 2
        run: python scrapers/metar.py || true

      - name: Commit & push updated weather
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dhm.json data/dhm_history.json data/metar.json
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git commit -m "data: weather $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            git pull --rebase origin main || true
            if git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying..."
            sleep 5
          done
          echo "Push failed after 3 attempts."
          exit 1
